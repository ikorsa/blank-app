{% extends "base.html" %}
{% block title %}Кабинет врача — вход{% endblock %}
{% block content %}
  <h1>Кабинет врача</h1>
  <p class="muted">Войдите логином врача (slug) или admin.</p>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        {{ field.label_tag }}
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <div class="actions">
      <button class="primary" type="submit">Войти</button>
      <a class="secondary" style="text-decoration:none;display:inline-block;" href="{% url 'intake:step1' %}">К анкете</a>
    </div>
  </form>
{% endblock %}
